<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séries Marvel + Zack Stryker</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: #FFD700;
            font-family: "Roboto", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 20px 0 30px 0;
            font-size: 2rem;
        }

        /* Menu de navegação */
        .menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .menu a {
            background-color: #FFD700;
            color: #000;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.2s;
        }

        .menu a:hover {
            background-color: #e6c200;
            transform: scale(1.05);
        }

        /* Card estilo YouTube */
        .yt-channel {
            background-color: #212121;
            border-radius: 12px;
            max-width: 480px;
            margin: 0 auto 50px auto;
            overflow: hidden;
            text-align: left;
            border: 1px solid #333;
        }

        .yt-banner {
            height: 110px;
            background: linear-gradient(90deg, #FFD700, #b8860b);
        }

        .yt-info {
            padding: 16px 20px 20px 20px;
            position: relative;
        }

        .yt-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid #212121;
            position: absolute;
            top: -40px;
            left: 20px;
            object-fit: cover;
            background-color: #333;
        }

        .yt-name {
            margin-left: 100px;
            font-size: 1.35rem;
            font-weight: bold;
            color: #fff;
        }

        .yt-subs {
            margin-left: 100px;
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .yt-btn {
            background-color: #FFD700;
            color: #000;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-block;
            margin-right: 8px;
            margin-top: 5px;
        }

        .yt-btn:hover {
            background-color: #e6c200;
        }

        /* Séries */
        .serie {
            border: 2px solid #FFD700;
            border-radius: 12px;
            padding: 20px;
            margin: 25px auto;
            max-width: 300px;
            background-color: #1a1a1a;
        }

        .serie img {
            width: 100%;
            max-width: 200px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 2px solid #FFD700;
        }

        .serie h2 {
            margin: 0 0 8px 0;
            font-size: 1.3rem;
            color: #FFD700;
        }

        .contador {
            font-size: 2.2rem;
            font-weight: bold;
            display: block;
            margin: 8px 0;
            color: #FFD700;
        }

        button {
            background-color: #FFD700;
            color: #000;
            border: none;
            padding: 10px 22px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
        }

        button:hover {
            background-color: #e6c200;
        }
    </style>
</head>
